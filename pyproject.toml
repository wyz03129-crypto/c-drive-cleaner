[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c-drive-cleaner"
version = "2.0.0a0"
description = "Safety-first Windows C drive analyzer and cleanup planner"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "C Drive Cleaner contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Win32 (MS Windows)",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
c-drive-cleaner = "cdrive_cleaner.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["cdrive_cleaner*"]

[tool.setuptools.package-data]
cdrive_cleaner = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=cdrive_cleaner --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cdrive_cleaner"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/cache_rules.py", "src/cleaner.py", "src/disk_analyzer.py", "src/gui.py", "src/logger.py", "src/main.py", "src/paths.py", "src/reporting.py", "src/safety.py", "src/scanner.py", "src/utils.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/cdrive_cleaner", "scripts"]
mypy_path = "src"
explicit_package_bases = true
