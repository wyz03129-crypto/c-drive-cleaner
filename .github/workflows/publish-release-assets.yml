name: Publish Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    if: github.event.release.prerelease == true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Run release gates
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Smoke test GUI offscreen
        run: python scripts/gui_smoke.py
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and test installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1
          .\scripts\test_installer.ps1
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object {
            $_.Name -eq "CDriveCleaner.exe" -or
            $_.Name -eq "CDriveCleaner.exe.sha256" -or
            $_.Name -like "CDriveCleaner-Setup-*-unsigned.exe" -or
            $_.Name -like "CDriveCleaner-Setup-*-unsigned.exe.sha256"
          } | ForEach-Object { $_.FullName }
          if ($assets.Count -ne 4) { throw "Expected four release assets, found $($assets.Count)." }
          gh release upload "${{ github.event.release.tag_name }}" $assets --clobber
