name: Publish Release Assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    if: github.event.release.prerelease == true
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Run release gates
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Smoke test GUI offscreen
        run: python scripts/gui_smoke.py
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build and test installer
        shell: pwsh
        run: |
          .\scripts\build_installer.ps1
          .\scripts\test_installer.ps1
      - name: Upload immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
            dist/CDriveCleaner.exe `
            dist/CDriveCleaner.exe.sha256 `
            dist/CDriveCleaner-Setup-2.0.0-beta.2-unsigned.exe `
            dist/CDriveCleaner-Setup-2.0.0-beta.2-unsigned.exe.sha256 `
            --clobber
