name: Build PDF Optimizer Windows Installer
on:
  push:
    branches:
      - temp/pdf-print-optimizer-installer
    paths:
      - 'pdf-optimizer/**'
      - '.github/workflows/build-pdf-optimizer-installer.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pdf-optimizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile standalone Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PDF_Print_Optimizer pdf_print_optimizer.py
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload Setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: PDF_Print_Optimizer_Setup_Windows
          path: pdf-optimizer/installer_output/PDF_Print_Optimizer_Setup.exe
          if-no-files-found: error
