name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/cdrive_cleaner/**"
      - "scripts/build_exe.ps1"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Run quality gates
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Import GUI entry point
        run: python -c "from cdrive_cleaner.ui.main_window import MainWindow; print(MainWindow.__name__)"
      - name: Build GUI executable
        shell: pwsh
        run: .\scripts\build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CDriveCleaner-windows-unsigned
          path: |
            dist/CDriveCleaner.exe
            dist/CDriveCleaner.exe.sha256
          if-no-files-found: error
          retention-days: 14
