name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/cdrive_cleaner/**"
      - "scripts/build_exe.ps1"
      - "scripts/build_installer.ps1"
      - "packaging/windows/**"
      - "scripts/gui_smoke.py"
      - "scripts/release_gate.py"
      - "PRIVACY.md"
      - "SECURITY.md"
      - "KNOWN_LIMITATIONS.md"
      - "config.json"
      - ".github/workflows/build-windows-exe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packaging dependencies
        run: python -m pip install -e ".[dev,packaging]"
      - name: Run quality gates
        shell: pwsh
        run: .\scripts\check.ps1
      - name: Smoke test GUI offscreen
        run: python scripts/gui_smoke.py
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - name: Build GUI executable and installer
        shell: pwsh
        run: .\scripts\build_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CDriveCleaner-windows-unsigned
          path: |
            dist/CDriveCleaner.exe
            dist/CDriveCleaner.exe.sha256
            dist/CDriveCleaner-Setup-*-unsigned.exe
            dist/CDriveCleaner-Setup-*-unsigned.exe.sha256
          if-no-files-found: error
          retention-days: 14
